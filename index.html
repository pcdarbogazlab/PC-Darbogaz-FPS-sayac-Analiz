    window.onload = function() {
        datalistDoldur('cpuList', islemciler);
        datalistDoldur('gpuList', ekranKartlari);
    };

    function datalistDoldur(listId, veriler) {
        const list = document.getElementById(listId);
        list.innerHTML = "";
        veriler.sort((a, b) => a.ad.localeCompare(b.ad));

        veriler.forEach(item => {
            let opt = document.createElement('option');
            opt.value = item.ad;
            list.appendChild(opt);
        });
    }

    function sistemHesapla() {
        let cpuAd = document.getElementById('cpuInput').value.trim();
        let gpuAd = document.getElementById('gpuInput').value.trim();

        let cpuObj = islemciler.find(i => i.ad.toLowerCase() === cpuAd.toLowerCase());
        let gpuObj = ekranKartlari.find(g => g.ad.toLowerCase() === gpuAd.toLowerCase());

        if (!cpuObj || !gpuObj) {
            alert("Lütfen öneri listesinden geçerli bir İşlemci ve Ekran Kartı seçiniz!");
            return;
        }

        let cpuPuan = cpuObj.puan;
        let gpuPuan = gpuObj.puan;
        let ram = parseInt(document.getElementById('ramSelect').value);
        let cozunurluk = document.getElementById('cozunurlukSelect').value;

        let etkiGpu = gpuPuan;
        if (cozunurluk === "2k") etkiGpu *= 0.85;
        if (cozunurluk === "4k") etkiGpu *= 0.70;

        let fark = cpuPuan - etkiGpu;
        let darbogazMetni = "", oneriMetni = "";

        if (fark > 15) {
            let yuzde = Math.min(Math.round(fark), 60);
            darbogazMetni = `<span class="text-warning">%${yuzde} Ekran Kartı Darboğazı</span>`;
            oneriMetni = `⚠️ <strong>Öneri:</strong> İşlemciniz oldukça güçlü. Ekran kartınızı bir üst modele yükselterek tam performans elde edebilirsiniz.`;
        } else if (fark < -15) {
            let yuzde = Math.min(Math.round(Math.abs(fark)), 60);
            darbogazMetni = `<span class="text-danger">%${yuzde} İşlemci Darboğazı</span>`;
            oneriMetni = `🔴 <strong>Öneri:</strong> Ekran kartınız yüksek performanslı ancak işlemciniz yetersiz kalıyor. Oyunlarda anlık takılmalar önlemek için işlemciyi yükseltmeniz önerilir.`;
        } else {
            darbogazMetni = `<span class="text-success">Darboğaz Yok</span>`;
            oneriMetni = `✅ <strong>Öneri:</strong> Parçalarınız birbiriyle son derece dengeli çalışıyor!`;
        }

        let fps = Math.round(((cpuPuan + gpuPuan) * 0.95) * (cozunurluk === "2k" ? 0.75 : cozunurluk === "4k" ? 0.50 : 1) + (ram >= 16 ? 10 : 0));
        let sistemPuani = Math.round((cpuPuan + gpuPuan) / 2);

        document.getElementById('darbogazMetni').innerHTML = darbogazMetni;
        document.getElementById('fpsMetni').innerText = fps;
        document.getElementById('puanMetni').innerText = sistemPuani;
        document.getElementById('oneriMetni').innerHTML = oneriMetni;

        let toplam = cpuPuan + gpuPuan;
        let cpuYuzde = Math.round((cpuPuan / toplam) * 100);
        document.getElementById('cpuBar').style.width = cpuYuzde + "%";
        document.getElementById('cpuBar').innerText = "CPU %" + cpuYuzde;
        document.getElementById('gpuBar').style.width = (100 - cpuYuzde) + "%";
        document.getElementById('gpuBar').innerText = "GPU %" + (100 - cpuYuzde);

        document.getElementById('sonucAlani').classList.remove('d-none');
    }
</script>
